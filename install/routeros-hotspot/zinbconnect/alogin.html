<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b21b6">
<title>Zinbconnect — Connexion réussie</title>
<style>
:root {
  --v: #5b21b6;
  --v2: #7c3aed;
  --v3: #a78bfa;
  --bg1: #f5f3ff;
  --bg2: #ede9fe;
  --card: #fff;
  --txt: #1f2937;
  --muted: #6b7280;
  --ok: #15803d;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--txt); line-height: 1.45; font-size: 17px;
  background: linear-gradient(160deg, var(--bg1) 0%, #fff 45%, var(--bg2) 100%);
  background-attachment: fixed; min-height: 100vh;
}
.wrap { max-width: 520px; margin: 0 auto; padding: 24px 14px 36px; text-align: center; }
.logo {
  width: 54px; height: 54px; border-radius: 16px; margin: 0 auto 16px;
  background: linear-gradient(135deg, var(--v), var(--v3));
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 24px; box-shadow: 0 6px 16px rgba(91,33,182,.28);
}
.card {
  background: var(--card); border-radius: 16px; padding: 24px 20px;
  box-shadow: 0 2px 10px rgba(76,29,149,.07); border: 1px solid rgba(237,233,254,.9);
}
h1 { font-size: 22px; margin: 0 0 8px; color: var(--ok); }
p { font-size: 15px; color: #4b5563; margin: 0 0 18px; line-height: 1.5; }
.btn {
  display: block; padding: 14px; background: linear-gradient(135deg, var(--v), var(--v2));
  color: #fff; text-decoration: none; font-weight: 700; border-radius: 12px;
  box-shadow: 0 6px 16px rgba(91,33,182,.25);
}
.small { font-size: 13px; color: var(--muted); margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Z</div>
  <div class="card">
    <h1>Connexion réussie !</h1>
    <p>Votre ticket a été validé. Vous pouvez désormais naviguer librement sur Internet.</p>
    <a class="btn" href="$(link-status)">Voir ma consommation & mon temps restant</a>
    <p class="small">Ouverture de votre suivi de consommation…</p>
  </div>
</div>
<script>
setTimeout(function () {
  window.location.href = "$(link-status)";
}, 1500);
</script>
</body>
</html>
