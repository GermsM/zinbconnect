<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zinbconnect — déconnecté</title>
<style>
  /* Page autonome : aucun lien externe (aucun CDN). */
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #0e2a3a; color: #eef6fa; padding: 16px; }
  main { width: 100%; max-width: 380px; background: #123247; border-radius: 14px; padding: 28px 24px;
         box-shadow: 0 12px 40px rgba(0,0,0,.35); text-align: center; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0 0 18px; font-size: 14px; color: #9fc3d4; line-height: 1.5; }
  a.btn { display: inline-block; padding: 12px 20px; border-radius: 10px; background: #4c9f7a;
          color: #fff; text-decoration: none; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Zinbconnect</h1>
  <p>Vous êtes déconnecté. Ce ticket conserve son temps restant :
  changez d'appareil ou revenez plus tard, puis reconnectez-vous
  avec le même code.</p>
  <p><a class="btn" href="$(link-login)">Se reconnecter</a></p>
</main>
</body>
</html>
