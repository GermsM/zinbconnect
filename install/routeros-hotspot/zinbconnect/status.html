<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zinbconnect — ma session</title>
$(if refresh-timeout)<meta http-equiv="refresh" content="$(refresh-timeout)">$(endif)
<style>
  /* Page autonome : aucun lien externe (aucun CDN). */
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #0e2a3a; color: #eef6fa; padding: 16px; }
  main { width: 100%; max-width: 380px; background: #123247; border-radius: 14px; padding: 26px 24px;
         box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  h1 { margin: 0 0 14px; font-size: 20px; text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: #9fc3d4; font-weight: 500; padding: 8px 4px; border-bottom: 1px solid #2b5672; }
  td { padding: 8px 4px; border-bottom: 1px solid #22485f; font-weight: 600; }
  td:last-child { text-align: right; color: #8fd4ae; }
  .actions { margin-top: 18px; text-align: center; }
  button { width: 100%; padding: 12px; font-size: 15px; font-weight: 600; border: 0; border-radius: 10px;
           background: #b34a4a; color: #fff; cursor: pointer; }
  p.small { margin: 14px 0 0; font-size: 12px; color: #7da7bb; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Ma session Wi-Fi</h1>
  <table>
    <tr><th>Temps restant</th><td>$(session-time-left)</td></tr>
    <tr><th>Téléchargé</th><td>$(bytes-in-nice)</td></tr>
    <tr><th>Envoyé</th><td>$(bytes-out-nice)</td></tr>
    $(if limit-uptime)<tr><th>Temps maximum</th><td>$(limit-uptime)</td></tr>$(endif)
  </table>
  <div class="actions">
    <form name="logout" action="$(link-logout)" method="post">
      <button type="submit">Se déconnecter</button>
    </form>
  </div>
  <p class="small">Le ticket s'arrête tout seul à la fin du temps ou des
  mégaoctets autorisés — rien à gérer.</p>
</main>
</body>
</html>
